name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SM="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK (signed)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/netmeter.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=netmeter \
            -Pandroid.injected.signing.key.password=android \
            -Pandroid.injected.signing.store.type=PKCS12

      - name: Copy APKs
        run: |
          VER=$(node -p "require('./package.json').version")
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$SRC" "netmeter-${VER}-debug.apk"
          cp "$SRC" "netmeter-latest-debug.apk"
          ls -la *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netmeter-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            netmeter-*-debug.apk
          retention-days: 90
